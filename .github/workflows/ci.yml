name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb desktop-file-utils
      - name: Unit, data separation, installer, and archive tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Desktop startup with a clean profile
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/check_desktop_startup.py
      - name: Cursor-local Notes, consistent text styling, and persistence
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/check_notes_editor.py
      - name: Stable on-screen Notes pixels while moving the caret
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/check_notes_paint.py
